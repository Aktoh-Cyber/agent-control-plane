name: Docker Build

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-test:
    name: Docker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (Node 22)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.node22-test
          push: false
          tags: agent-control-plane:test-node22
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build validation image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.node22-validation
          push: false
          tags: agent-control-plane:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build NPM validation image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.npm-validation
          push: false
          tags: agent-control-plane:npm-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
